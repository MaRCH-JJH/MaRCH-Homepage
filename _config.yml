# Site settings
title: MaRCH Lab
description: "Microwave and RF Circuit ResearcH Lab"
url: "https://march-jjh.github.io"
baseurl: "/MaRCH-Homepage"
lang: "ko_KR"

# Author / Lab info
lab_name: "MaRCH Lab"
lab_name_en: "Microwave and RF Circuit ResearcH Lab"
email: "jyjeon@kangwon.ac.kr"
address: "강원특별자치도 강릉시 죽헌길 7 (지변동) 공학1호관(N11) 501호"
phone: "033-640-2430"

# Social
github_username: "marchlab"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - docs/
  - .github/
  - admin/config.yml
  - PROMPT.md
  - DESIGN.md
  - oauth-worker/

# Include
include:
  - _redirects
  - .nojekyll

# Sass
sass:
  style: compressed

# Kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Feed
feed:
  path: feed.xml

# SEO
twitter:
  card: summary_large_image

social:
  name: MaRCH Lab
  links:
    - https://github.com/marchlab

# Google Analytics (optional)
google_analytics: ""
