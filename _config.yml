# Site settings
title: MaRCH Lab
description: "Microwave and RF Circuit Hub Laboratory"
url: "https://march-jjh.github.io"
baseurl: "/MaRCH-Homepage"
lang: "ko_KR"

# Author / Lab info
lab_name: "MaRCH Lab"
lab_name_en: "Microwave and RF Circuit Hub Laboratory"
email: "marchlab@example.ac.kr"
address: "강원도 강릉시 범일로 57 강원대학교 강릉캠퍼스 공학관 000호"
phone: "+82-33-640-0000"

# Social
github_username: "marchlab"
twitter_username: "marchlab"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - docs/
  - .github/
  - static/admin/config.yml
  - PROMPT.md
  - DESIGN.md

# Include
include:
  - _redirects
  - .nojekyll

# Sass
sass:
  style: compressed

# Kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Feed
feed:
  path: feed.xml

# SEO
twitter:
  username: marchlab
  card: summary_large_image

social:
  name: MaRCH Lab
  links:
    - https://github.com/marchlab
    - https://twitter.com/marchlab

# Google Analytics (optional)
google_analytics: ""

# Decap CMS
decap_cms:
  enabled: true
  backend:
    name: git-gateway
    branch: main