# Site settings
title: MaRCH Lab
description: "Microwave and RF Circuit ResearcH Lab"
url: "https://march-jjh.github.io"
baseurl: "/MaRCH-Homepage"
lang: "ko_KR"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - docs/
  - .github/
  - admin/config.yml
  - PROMPT.md
  - DESIGN.md
  - oauth-worker/

# Include
include:
  - _redirects
  - .nojekyll

# Sass
sass:
  style: compressed

# Kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Feed
feed:
  path: feed.xml

# Google Analytics (optional)
google_analytics: ""
