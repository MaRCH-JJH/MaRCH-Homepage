<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rfm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3"/>
      <stop offset="100%" style="stop-color:#00a1ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#f0f4f8"/>

  <!-- antenna -->
  <g stroke="url(#rfm)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="220" y1="330" x2="220" y2="150"/>
    <path d="M220 150 L180 100"/>
    <path d="M220 150 L260 100"/>
  </g>
  <circle cx="220" cy="345" r="12" fill="url(#rfm)" opacity="0.85"/>

  <!-- radiating waves -->
  <g stroke="url(#rfm)" stroke-width="2.5" fill="none" opacity="0.4">
    <path d="M255 130 A70 70 0 0 1 255 260"/>
    <path d="M290 105 A115 115 0 0 1 290 285"/>
    <path d="M325 80 A160 160 0 0 1 325 310"/>
  </g>

  <!-- analyzer screen -->
  <g transform="translate(430,140)">
    <rect x="0" y="0" width="290" height="200" rx="10" fill="#1d1d1f" opacity="0.9"/>
    <rect x="16" y="16" width="258" height="150" rx="4" fill="#0a0a0c"/>
    <polyline points="16,150 50,130 84,140 118,80 152,120 186,60 220,110 254,90 274,100" fill="none" stroke="url(#rfm)" stroke-width="2.5"/>
    <g stroke="#3a3a3c" stroke-width="1">
      <line x1="16" y1="46" x2="274" y2="46"/>
      <line x1="16" y1="91" x2="274" y2="91"/>
      <line x1="16" y1="136" x2="274" y2="136"/>
    </g>
    <rect x="16" y="178" width="258" height="10" rx="2" fill="url(#rfm)" opacity="0.6"/>
  </g>

  <text x="575" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#515154" text-anchor="middle">Spectrum / Network Analyzer</text>
</svg>
