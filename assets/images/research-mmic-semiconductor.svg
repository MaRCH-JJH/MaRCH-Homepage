<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3"/>
      <stop offset="100%" style="stop-color:#00a1ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#f0f4f8"/>

  <!-- wafer -->
  <circle cx="400" cy="250" r="170" fill="none" stroke="url(#mmic)" stroke-width="2.5" opacity="0.4"/>
  <path d="M400 80 A170 170 0 0 1 400 420" fill="none" stroke="url(#mmic)" stroke-width="2.5" opacity="0.25"/>

  <!-- die grid -->
  <g fill="none" stroke="url(#mmic)" stroke-width="1.5" opacity="0.35">
    <path d="M260 130 H540 M260 170 H540 M260 210 H540 M260 250 H540 M260 290 H540 M260 330 H540 M260 370 H540"/>
    <path d="M280 110 V390 M320 110 V390 M360 110 V390 M400 110 V390 M440 110 V390 M480 110 V390 M520 110 V390"/>
  </g>

  <!-- highlighted die / IC package -->
  <g transform="translate(340,200)">
    <rect x="0" y="0" width="120" height="100" rx="6" fill="url(#mmic)" opacity="0.92"/>
    <g stroke="url(#mmic)" stroke-width="3" opacity="0.7">
      <line x1="0" y1="20" x2="-16" y2="20"/>
      <line x1="0" y1="50" x2="-16" y2="50"/>
      <line x1="0" y1="80" x2="-16" y2="80"/>
      <line x1="120" y1="20" x2="136" y2="20"/>
      <line x1="120" y1="50" x2="136" y2="50"/>
      <line x1="120" y1="80" x2="136" y2="80"/>
    </g>
    <text x="60" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">MMIC</text>
  </g>
</svg>
