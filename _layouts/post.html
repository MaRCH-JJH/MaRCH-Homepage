---
layout: default
---
<article class="post-content">
  <header class="page-header post-header">
    <div class="container">
      <a href="{{ site.baseurl }}/news/" class="post-back-link">
        <span class="post-back-icon" aria-hidden="true">{% include icon.html name="arrow-right" size="small" %}</span>
        소식 목록으로
      </a>
      <div class="post-meta">
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
        {% if page.category %}
        <span class="post-category">{{ page.category }}</span>
        {% endif %}
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </header>

  <div class="page-body post-body-wrapper">
    <div class="container post-container">
      {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="" class="post-image" loading="lazy">
      {% endif %}

      <div class="post-body">
        {{ content }}
      </div>
    </div>
  </div>
</article>
