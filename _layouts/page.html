---
layout: default
---
<article class="page-content">
  <header class="page-header">
    <div class="container">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>

  <div class="page-body">
    <div class="container">
      {{ content }}
    </div>
  </div>
</article>
