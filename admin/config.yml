# Decap CMS Configuration
backend:
  name: github
  repo: march-jjh/MaRCH-Homepage
  branch: main
  base_url: https://1.jinho2850.workers.dev
  client_id: Ov23li5MrV3cMYhEUabb
  commit_messages:
    create: "Create {{collection}} \"{{slug}}\""
    update: "Update {{collection}} \"{{slug}}\""
    delete: "Delete {{collection}} \"{{slug}}\""
    uploadMedia: "[skip ci] Upload \"{{path}}\""
    deleteMedia: "[skip ci] Delete \"{{path}}\""

media_folder: "assets/images"
# Full, absolute URL (not "/assets/images") because this site is deployed to a
# GitHub Pages *project* page (march-jjh.github.io/MaRCH-Homepage/, not the
# domain root). A root-relative public_folder resolves against the domain
# root in the CMS's own editor preview and 404s. Every image widget's stored
# path is therefore a fully-qualified URL now; _includes/image-url.html
# handles both this format and any older root-relative paths already in the
# data files, so nothing else needed to change for existing content.
public_folder: "https://march-jjh.github.io/MaRCH-Homepage/assets/images"

site_url: https://march-jjh.github.io/MaRCH-Homepage
logo_url: https://march-jjh.github.io/MaRCH-Homepage/assets/images/logo.png

collections:
  # Site settings (single file)
  - name: "site"
    label: "사이트 설정"
    label_singular: "사이트 설정"
    description: "사이트 전체 설정 (네비게이션, 푸터, 히어로 등)"
    files:
      - name: "site"
        label: "사이트 설정"
        file: "_data/site.yml"
        fields:
          - {name: name, label: "사이트명 (한글)", widget: "string"}
          - {name: name_en, label: "사이트명 (영문)", widget: "string"}
          - {name: tagline, label: "태그라인 (한글)", widget: "string"}
          - {name: tagline_en, label: "태그라인 (영문)", widget: "string"}
          - {name: description, label: "설명 (한글)", widget: "text"}
          - {name: description_en, label: "설명 (영문)", widget: "text"}
          - {name: email, label: "이메일", widget: "string"}
          - {name: phone, label: "전화번호", widget: "string"}
          - {name: address, label: "주소 (한글)", widget: "string"}
          - {name: address_en, label: "주소 (영문)", widget: "string"}
          - {name: github, label: "GitHub URL", widget: "string"}
          - {name: keywords, label: "키워드", widget: "string"}
          - {name: og_image, label: "OG 이미지 경로", widget: "string"}
          - {name: navigation, label: "네비게이션", widget: "list", fields: [
              {name: title, label: "메뉴명 (한글)", widget: "string"},
              {name: url, label: "URL", widget: "string"},
              {name: en, label: "메뉴명 (영문)", widget: "string"}
            ]}
          - {name: footer, label: "푸터", widget: "object", fields: [
              {name: copyright, label: "저작권 문구", widget: "string"},
              {name: powered_by, label: "Powered by 문구", widget: "string"},
              {name: links, label: "링크", widget: "list", fields: [
                  {name: title, label: "링크명", widget: "string"},
                  {name: url, label: "URL", widget: "string"}
                ]}
            ]}
          - {name: hero, label: "히어로 섹션", widget: "object", fields: [
              {name: title, label: "제목 (한글)", widget: "string"},
              {name: title_en, label: "제목 (영문)", widget: "string"},
              {name: subtitle, label: "부제목 (한글)", widget: "text"},
              {name: subtitle_en, label: "부제목 (영문)", widget: "text"},
              {name: cta_text, label: "CTA 버튼 텍스트 (한글)", widget: "string"},
              {name: cta_text_en, label: "CTA 버튼 텍스트 (영문)", widget: "string"},
              {name: cta_url, label: "CTA 버튼 URL", widget: "string"},
              {name: background_image, label: "배경 이미지", widget: "image", required: false},
              {name: stats, label: "통계", widget: "list", fields: [
                  {name: label, label: "라벨", widget: "string"},
                  {name: value, label: "값", widget: "string"}
                ]}
            ]}
          - {name: highlights, label: "하이라이트", widget: "list", fields: [
              {name: title, label: "제목", widget: "string"},
              {name: description, label: "설명", widget: "text"},
              {name: icon, label: "아이콘명", widget: "string"},
              {name: url, label: "연결 URL", widget: "string"}
            ]}
          - {name: theme, label: "테마", widget: "object", fields: [
              {name: primary_color, label: "기본 색상", widget: "string"},
              {name: accent_color, label: "액센트 색상", widget: "string"}
            ]}

  # About page (single file: _data/about.yml -- the "연구실 소개" page's Hero/
  # Intro/Vision/Workflow/CTA text. Its Research Areas section pulls from the
  # "research" collection below instead, so it isn't duplicated here.)
  - name: "about"
    label: "연구실 소개 페이지"
    label_singular: "연구실 소개"
    description: "연구실 소개(About) 페이지 콘텐츠 관리"
    files:
      - name: "about"
        label: "연구실 소개"
        file: "_data/about.yml"
        fields:
          - {name: hero, label: "히어로", widget: "object", fields: [
              {name: title, label: "제목", widget: "string", required: true},
              {name: subtitle, label: "부제목", widget: "string", required: false}
            ]}
          - {name: intro, label: "소개", widget: "object", fields: [
              {name: heading, label: "제목", widget: "string", required: true},
              {name: paragraph_1, label: "본문 1", widget: "text", required: false},
              {name: paragraph_2, label: "본문 2", widget: "text", required: false},
              {name: image, label: "이미지", widget: "image", required: false}
            ]}
          - {name: vision, label: "Research Vision 카드", widget: "list", fields: [
              {name: icon, label: "아이콘명", widget: "string", required: true},
              {name: title, label: "제목", widget: "string", required: true},
              {name: description, label: "설명", widget: "text", required: false}
            ]}
          - {name: workflow, label: "Research Workflow 단계", widget: "list", fields: [
              {name: title, label: "제목", widget: "string", required: true},
              {name: description, label: "설명", widget: "text", required: false}
            ]}
          - {name: cta, label: "하단 CTA", widget: "object", fields: [
              {name: title, label: "제목", widget: "string", required: true},
              {name: text, label: "설명", widget: "text", required: false}
            ]}

  # Professor page (single file: _data/professor.yml -- the "지도교수" page's
  # profile, research interests, education/career/publications/patents, and
  # office location. Contact email is not duplicated here -- it comes from
  # the "site" collection's email field, which the page already uses.)
  - name: "professor"
    label: "지도교수 페이지"
    label_singular: "지도교수"
    description: "지도교수(Professor) 페이지 콘텐츠 관리"
    files:
      - name: "professor"
        label: "지도교수"
        file: "_data/professor.yml"
        fields:
          - {name: name, label: "이름", widget: "string", required: true}
          - {name: eyebrow, label: "상단 라벨", widget: "string", required: false, hint: "예: Faculty"}
          - {name: role, label: "직책", widget: "string", required: true, hint: "예: Professor"}
          - {name: affiliation, label: "소속", widget: "string", required: false}
          - {name: photo, label: "프로필 사진", widget: "image", required: false}
          - {name: interests, label: "연구 관심분야", widget: "list", fields: [
              {name: en, label: "영문", widget: "string", required: true},
              {name: ko, label: "한글", widget: "string", required: false}
            ]}
          - {name: education, label: "학력", widget: "list", required: false, hint: "한 줄에 한 항목씩 (예: 1999 서울대학교 공학사 - 전기공학부)"}
          - {name: career, label: "주요 경력", widget: "list", fields: [
              {name: text, label: "내용", widget: "string", required: true},
              {name: sub_items, label: "하위 항목 (선택)", widget: "list", required: false}
            ]}
          - {name: publications, label: "주요 논문", widget: "list", fields: [
              {name: title, label: "논문 제목", widget: "string", required: true},
              {name: meta, label: "저자 · 저널 · 날짜", widget: "string", required: false}
            ]}
          - {name: patents, label: "특허", widget: "list", fields: [
              {name: title, label: "특허명", widget: "string", required: true},
              {name: meta, label: "발명자 · 특허번호 · 날짜", widget: "string", required: false}
            ]}
          - {name: office, label: "연구실 위치", widget: "string", required: false}

  # News (Jekyll posts, one file per entry in _posts/ -- this one genuinely is
  # a folder collection, unlike members/research/awards/publications above,
  # since Jekyll posts are already designed as one-file-per-post)
  - name: "news"
    label: "최신소식"
    label_singular: "소식"
    description: "홈 화면과 /news/ 목록에 나오는 연구실 소식·공지"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - {name: layout, widget: "hidden", default: "post"}
      - {name: lang, widget: "hidden", default: "ko_KR"}
      - {name: title, label: "제목", widget: "string", required: true}
      - {name: date, label: "날짜", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false}
      - {name: pinned, label: "상단 고정", widget: "boolean", default: false, hint: "켜면 날짜와 무관하게 항상 맨 위쪽에 노출됩니다."}
      - {name: order, label: "고정 노출 순서", widget: "number", default: 0, required: false, hint: "'상단 고정'을 켠 글에만 적용됩니다 (숫자가 작을수록 먼저 노출). 고정하지 않은 글은 이 값과 무관하게 항상 날짜순으로 표시됩니다."}
      - {name: category, label: "카테고리", widget: "string", required: false, hint: "예: 공지사항, 논문 게재, 수상 소식, 모집 공고"}
      - {name: excerpt, label: "요약 (목록에 표시되는 짧은 설명)", widget: "text", required: false}
      - {name: image, label: "대표 이미지", widget: "image", required: false}
      - {name: body, label: "본문", widget: "markdown", required: false}
      - {name: gallery_columns, label: "사진 한 줄에 몇 장?", widget: "select", options: ["1", "2", "3"], default: "2", required: false, hint: "아래 '사진들'에 넣은 사진이 한 줄에 몇 장씩 나란히 표시될지 정합니다. 숫자가 클수록 사진이 작아집니다."}
      - {name: gallery, label: "사진들 (여러 장 추가 가능, 나란히 표시됨)", widget: "list", required: false, fields: [
          {name: image, label: "이미지", widget: "image", required: true},
          {name: caption, label: "설명 (선택)", widget: "string", required: false}
        ]}

  # Members (single file: _data/members.yml, edited as one list)
  - name: "members"
    label: "멤버"
    label_singular: "멤버"
    description: "연구실 멤버 관리 (교수, 박사후연구원, 박사과정, 석사과정, 졸업생)"
    files:
      - name: "members"
        label: "멤버"
        file: "_data/members.yml"
        fields:
          - {name: items, label: "멤버 목록", widget: "list", fields: [
              {name: id, label: "ID", widget: "string", required: true},
              {name: name, label: "이름 (한글)", widget: "string", required: true},
              {name: name_en, label: "이름 (영문)", widget: "string", required: false},
              {name: role, label: "직책 (한글)", widget: "select", options: ["교수", "박사후연구원", "박사과정", "석사과정", "학부연구생", "졸업생"], required: true},
              {name: role_en, label: "직책 (영문)", widget: "select", options: ["Professor", "Postdoctoral Researcher", "Ph.D. Candidate", "M.S. Candidate", "Undergraduate Researcher", "Alumni"], required: false},
              {name: degree, label: "학위", widget: "string", required: false},
              {name: major, label: "전공 (한글)", widget: "string", required: false},
              {name: major_en, label: "전공 (영문)", widget: "string", required: false},
              {name: current_position, label: "현재 소속 (졸업생 취업처)", widget: "string", required: false, hint: "졸업생 카드에 강조 표시됩니다. 예: peopleworks ARSENAL"},
              {name: email, label: "이메일", widget: "string", required: false},
              {name: phone, label: "전화번호", widget: "string", required: false},
              {name: office, label: "연구실", widget: "string", required: false},
              {name: image, label: "프로필 이미지", widget: "image", required: false},
              {name: bio, label: "소개 (한글)", widget: "text", required: false},
              {name: bio_en, label: "소개 (영문)", widget: "text", required: false},
              {name: research_interests, label: "연구 관심분야 (한글)", widget: "list", required: false},
              {name: research_interests_en, label: "연구 관심분야 (영문)", widget: "list", required: false},
              {name: google_scholar, label: "Google Scholar URL", widget: "string", required: false},
              {name: orcid, label: "ORCID", widget: "string", required: false},
              {name: category, label: "카테고리", widget: "select", options: ["professor", "postdoc", "phd", "master", "undergrad", "alumni"], required: true},
              {name: order, label: "정렬 순서", widget: "number", required: true}
            ]}

  # Research Areas (single file: _data/research.yml, edited as one list)
  - name: "research"
    label: "연구 분야"
    label_singular: "연구 분야"
    description: "연구 분야 관리"
    files:
      - name: "research"
        label: "연구 분야"
        file: "_data/research.yml"
        fields:
          - {name: items, label: "연구 분야 목록", widget: "list", fields: [
              {name: id, label: "ID", widget: "string", required: true},
              {name: title, label: "제목 (한글)", widget: "string", required: true},
              {name: title_en, label: "제목 (영문)", widget: "string", required: false},
              {name: subtitle, label: "부제목 (한글)", widget: "string", required: false},
              {name: subtitle_en, label: "부제목 (영문)", widget: "string", required: false},
              {name: description, label: "설명 (한글)", widget: "markdown", required: false},
              {name: description_en, label: "설명 (영문)", widget: "markdown", required: false},
              {name: icon, label: "아이콘명", widget: "string", required: true},
              {name: image, label: "이미지", widget: "image", required: false},
              {name: featured, label: "핵심 연구분야로 표시", widget: "boolean", default: false},
              {name: keywords, label: "키워드 (한글)", widget: "list", required: false},
              {name: keywords_en, label: "키워드 (영문)", widget: "list", required: false},
              {name: order, label: "정렬 순서", widget: "number", required: true}
            ]}

  # Awards (single file: _data/awards.yml, edited as one list grouped by year)
  - name: "awards"
    label: "수상 경력"
    label_singular: "수상 경력"
    description: "수상 경력 관리 (연도별 그룹화)"
    files:
      - name: "awards"
        label: "수상 경력"
        file: "_data/awards.yml"
        fields:
          - {name: years, label: "연도별 수상 내역", widget: "list", fields: [
              {name: year, label: "연도", widget: "number", required: true},
              {name: items, label: "수상 내역", widget: "list", fields: [
                  {name: id, label: "ID", widget: "string", required: true},
                  {name: title, label: "수상명 (한글)", widget: "string", required: true},
                  {name: title_en, label: "수상명 (영문)", widget: "string", required: false},
                  {name: organization, label: "수여기관 (한글)", widget: "string", required: false},
                  {name: organization_en, label: "수여기관 (영문)", widget: "string", required: false},
                  {name: date, label: "수상일", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false},
                  {name: recipient, label: "수상자 (한글)", widget: "string", required: false},
                  {name: recipient_en, label: "수상자 (영문)", widget: "string", required: false},
                  {name: description, label: "설명 (한글)", widget: "text", required: false},
                  {name: description_en, label: "설명 (영문)", widget: "text", required: false},
                  {name: category, label: "카테고리 (한글)", widget: "select", options: ["학회상", "논문상", "정부포상", "재단상", "대학상", "국제논문상"], required: false},
                  {name: category_en, label: "카테고리 (영문)", widget: "select", options: ["Society Award", "Paper Award", "Government Award", "Foundation Award", "University Award", "International Paper Award"], required: false},
                  {name: image, label: "이미지", widget: "image", required: false},
                  {name: link, label: "상세 링크", widget: "string", required: false}
                ]}
            ]}

  # Publications (single file: _data/publications.yml, edited as one list grouped by year)
  - name: "publications"
    label: "논문/성과"
    label_singular: "논문"
    description: "논문 및 연구성과 관리 (연도별 그룹화)"
    files:
      - name: "publications"
        label: "논문/성과"
        file: "_data/publications.yml"
        fields:
          - {name: years, label: "연도별 논문 목록", widget: "list", fields: [
              {name: year, label: "연도", widget: "number", required: true},
              {name: items, label: "논문 목록", widget: "list", fields: [
                  {name: id, label: "ID", widget: "string", required: true},
                  {name: title, label: "논문 제목 (영문)", widget: "string", required: true},
                  {name: title_ko, label: "논문 제목 (한글)", widget: "string", required: false},
                  {name: authors, label: "저자", widget: "string", required: false},
                  {name: journal, label: "저널명", widget: "string", required: false},
                  {name: volume, label: "권", widget: "string", required: false},
                  {name: issue, label: "호", widget: "string", required: false},
                  {name: pages, label: "페이지", widget: "string", required: false},
                  {name: year, label: "출판 연도", widget: "number", required: false},
                  {name: doi, label: "DOI", widget: "string", required: false},
                  {name: url, label: "논문 URL", widget: "string", required: false},
                  {name: type, label: "타입", widget: "select", options: ["Journal", "Conference"], required: true},
                  {name: category, label: "분야", widget: "select", options: ["Circuit Design", "Power Amplifier", "MMIC", "Measurement"], required: false},
                  {name: conference, label: "컨퍼런스명", widget: "string", required: false},
                  {name: conference_full, label: "컨퍼런스 전체명", widget: "string", required: false},
                  {name: location, label: "개최지", widget: "string", required: false},
                  {name: date, label: "발표일", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false},
                  {name: featured, label: "추천 논문", widget: "boolean", default: false},
                  {name: abstract, label: "초록 (영문)", widget: "text", required: false},
                  {name: keywords, label: "키워드", widget: "list", required: false}
                ]}
            ]}