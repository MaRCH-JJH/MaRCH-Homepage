<header class="site-header" role="banner">
  <div class="container header-inner">
    <a href="{{ site.baseurl }}/" class="site-logo" aria-label="{{ site.data.site.name }} 홈으로">
      <svg class="logo-mark" aria-hidden="true" viewBox="0 0 32 32" width="32" height="32">
        <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
        <path d="M8 16 L14 22 L24 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">{{ site.data.site.name }}</span>
    </a>
    
    <nav class="site-nav" role="navigation" aria-label="메인 내비게이션">
      <ul class="nav-list">
        {% for item in site.data.site.navigation %}
        <li class="nav-item">
          <a href="{{ site.baseurl }}{{ item.url }}" class="nav-link {% if page.url == item.url or page.url contains item.url %}active{% endif %}" aria-current="{% if page.url == item.url or page.url contains item.url %}page{% endif %}">
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
    
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="다크 모드 전환" type="button">
        <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </g>
        </svg>
        <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
      
      <a href="{{ site.baseurl }}/admin/" class="admin-link" aria-label="관리자 페이지">
        {% include icon.html name="settings" size="medium" %}
      </a>
      
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-nav" type="button">
        <span class="hamburger" aria-hidden="true">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </span>
      </button>
    </div>
  </div>
</header>
