<header class="site-header" role="banner">
  <div class="container header-inner">
    <a href="{{ site.baseurl }}/" class="site-logo" aria-label="{{ site.data.site.name }} 홈으로">
      <img class="logo-mark" src="{{ site.baseurl }}/assets/images/logo.png" alt="" width="40" height="32">
      <span class="logo-text">{{ site.data.site.name }}</span>
    </a>
    
    <nav class="site-nav" role="navigation" aria-label="메인 내비게이션">
      <ul class="nav-list">
        {% for item in site.data.site.navigation %}
        <li class="nav-item">
          <a href="{{ site.baseurl }}{{ item.url }}" class="nav-link {% if page.url == item.url %}active{% endif %}" aria-current="{% if page.url == item.url %}page{% endif %}">
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
    
    <div class="header-actions">
      <a href="{{ site.baseurl }}/admin/" class="admin-link" aria-label="관리자 페이지">
        {% include icon.html name="settings" size="medium" %}
      </a>
      
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-nav" type="button">
        <span class="hamburger" aria-hidden="true">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </span>
      </button>
    </div>
  </div>
</header>
