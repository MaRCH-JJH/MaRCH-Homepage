years:
  - year: 2023
    items:
      - category_en: Society Award
        date: 2023-11-24
        organization: 한국전자파학회
        title: 우수 논문상
        recipient: 전예지, 김욱현, 전주영
        id: yeji
        image: https://march-jjh.github.io/MaRCH-Homepage/assets/images/전예지1_1.png
        description: >-
          우리 대학 전자공학과 대학원생 전예지, 김욱현(지도교수 전주영)이 한국전자파학회에서 주최한 2023 한국전자파학회 제35차
          정기총회 및 추계학술대회에서 우수논문상을 수상하였다.


          ‘인류를 향한 전자파 기술:반도체에서 우주 국방산업까지’라는 슬로건으로 11월23일부터 24일까지 2일간 서울 더케이호텔에서 개최된 이번 학술대회에는 전국 130여편의 논문이 발표되었으며 그 중 전예지 대학원생의 “LPWAN IoT용 고출력 전력증폭기 설계” 논문이 우수논문으로 선정되었다.
        category: 학회상
