  subtitle_en: "Monolithic microwave integrated circuit and RF semiconductor device design"
  description: |
    MMIC(Monolithic Microwave Integrated Circuit) 설계와 RF 반도체 공정을
    연구합니다. 반도체 소자 모델링부터 레이아웃 설계, 웨이퍼 레벨 검증까지
    RF 집적회로 개발 전 과정을 다룹니다.
  description_en: |
    Researching MMIC (Monolithic Microwave Integrated Circuit) design and RF
    semiconductor processes, spanning device modeling, layout design, and
