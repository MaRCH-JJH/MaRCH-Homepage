- id: rf-circuit-design
  title: "RF/Microwave Circuit Design"
  title_en: "RF/Microwave Circuit Design"
  subtitle: "임피던스 매칭 및 EM 시뮬레이션 기반 수동/능동 회로 설계"
  subtitle_en: "Passive/active circuit design based on impedance matching and EM simulation"
  description: |
    RF/Microwave 대역에서 동작하는 수동 및 능동 회로를 설계합니다. 임피던스 매칭
    네트워크, 필터, 커플러 등 수동 소자 설계와 EM 시뮬레이션 기반 검증을 통해
    안정적이고 재현 가능한 RF 회로 설계 방법론을 연구합니다.
  description_en: |
    Designing passive and active circuits operating in the RF/Microwave band.
    Research covers impedance matching networks, filters, and couplers, combined
    with EM simulation-based verification for reliable and reproducible RF
    circuit design methodology.
  icon: "cpu"
  image: "/assets/images/research-rf-circuit-design.svg"
  keywords:
    - "Impedance Matching"
    - "EM Simulation"
    - "RF Filter"
    - "Passive Circuit Design"
  keywords_en:
    - "Impedance Matching"
    - "EM Simulation"
    - "RF Filter"
    - "Passive Circuit Design"
  order: 1

- id: power-amplifier
  title: "RF Power Amplifier"
  title_en: "RF Power Amplifier"
  subtitle: "GaN/GaAs 소자 기반 고효율·고출력 전력 증폭기 연구"
  subtitle_en: "High-efficiency, high-power amplifier research based on GaN/GaAs devices"
  description: |
    MaRCH Lab의 핵심 연구분야로, RF Power Amplifier의 효율과 선형성을 함께
    향상시키는 설계 기법을 연구합니다. GaAs HBT/pHEMT 및 GaN 소자를 기반으로
    Doherty PA 구조를 포함한 high-efficiency, high-power, broadband PA 설계
    방법론을 다룹니다.
  description_en: |
    The core research area of MaRCH Lab, focused on design techniques that
    improve both efficiency and linearity of RF power amplifiers. Research is
    based on GaAs HBT/pHEMT and GaN devices, covering Doherty PA architectures
    and high-efficiency, high-power, broadband PA design methodology.
  icon: "waveform"
  image: "/assets/images/research-power-amplifier.svg"
  keywords:
    - "GaN HEMT"
    - "GaAs HBT/pHEMT"
    - "Doherty PA"
    - "Broadband PA"
  keywords_en:
    - "GaN HEMT"
    - "GaAs HBT/pHEMT"
    - "Doherty PA"
    - "Broadband PA"
  order: 2

