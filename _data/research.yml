- id: rf-measurement-system
  title: "RF Measurement & System"
  title_en: "RF Measurement & System"
  subtitle: "네트워크/스펙트럼 분석기 기반 RF 특성평가 및 시스템 검증"
  subtitle_en: "RF characterization and system verification using network/spectrum analyzers"
  description: |
    네트워크 분석기(VNA)와 스펙트럼 분석기를 활용한 RF 소자 및 회로의
    특성평가 방법을 연구합니다. 설계된 회로와 증폭기가 실제 시스템 환경에서
    요구 성능을 만족하는지 검증하는 계측·시스템 레벨 연구를 수행합니다.
  description_en: |
    Researching RF device and circuit characterization methods using network
    analyzers (VNA) and spectrum analyzers. This includes measurement and
    system-level verification confirming that designed circuits and amplifiers
    meet target performance in real system environments.
  icon: "antenna"
  image: "/assets/images/research-rf-measurement-system.svg"
  keywords:
    - "VNA Measurement"
    - "Spectrum Analysis"
    - "RF Characterization"
    - "System Verification"
  keywords_en:
    - "VNA Measurement"
    - "Spectrum Analysis"
    - "RF Characterization"
    - "System Verification"
  order: 4
