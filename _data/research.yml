# Research areas data
# Editable via Decap CMS (Research collection)

- id: computational
  title: "계산 소재 설계"
  title_en: "Computational Materials Design"
  subtitle: "DFT와 머신러닝을 활용한 신소재 발굴 및 물성 예측"
  subtitle_en: "Novel materials discovery and property prediction using DFT and ML"
  description: |
    제1원리 계산(DFT)과 머신러닝 기법을 결합하여 실험적 시행착오를 최소화하고, 
    원하는 물성을 가진 신소재를 컴퓨터 상에서 설계합니다. 고엔트로피 합금, 
    촉매 소재, 2차원 소재 등 다양한 시스템을 대상으로 연구를 수행합니다.
  description_en: |
    Combining first-principles calculations (DFT) with machine learning techniques 
    to minimize experimental trial-and-error and design novel materials with target 
    properties in silico. Research spans high-entropy alloys, catalysts, and 2D materials.
  icon: "cpu"
  image: "/assets/images/research/computational.jpg"
  keywords:
    - "DFT"
    - "Machine Learning"
    - "High-Throughput Screening"
    - "Materials Informatics"
  keywords_en:
    - "DFT"
    - "Machine Learning"
    - "High-Throughput Screening"
    - "Materials Informatics"
  projects:
    - title: "고엔트로피 합금 상 안정성 예측"
      period: "2022-2025"
      funding: "한국연구재단 중견연구자지원사업"
    - title: "ML 기반 촉매 소재 스크리닝 플랫폼"
      period: "2023-2026"
      funding: "산업통상자원부 소재부품기술개발사업"
  publications:
    - "Kim et al., Nature Computational Science, 2023"
    - "Lee et al., npj Computational Materials, 2022"
  order: 1

- id: energy
