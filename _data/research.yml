  subtitle_en: "Next-gen battery, solar cell, and hydrogen energy materials"
  description: |
    탄소중립 실현을 위한 핵심 소재 기술을 개발합니다. 전고체전지용 고체전해질, 
    리튬-황/리튬-공기 전지 양극 소재, 페로브스카이트 태양전지, 
    수소 생산/저장 소재 등 차세대 에너지 소재를 연구합니다.
  description_en: |
    Developing key materials technologies for carbon neutrality. Research includes 
    solid electrolytes for all-solid-state batteries, cathode materials for Li-S/Li-air 
