    극한 환경에서 견딜 수 있는 초고강도·고내구성 소재를 개발합니다. 
    고망간강, 티타늄 합금, 세라믹 복합소재 등을 대상으로 변형 메커니즘을 
    규명하고 적층 제조 공정을 최적화합니다.
  description_en: |
    Developing ultra-high-strength, high-durability materials for extreme environments. 
    Investigating deformation mechanisms and optimizing additive manufacturing processes 
    for high-Mn steels, Ti alloys, and ceramic matrix composites.
