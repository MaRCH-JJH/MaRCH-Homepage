    bio: |-
      RF 전력증폭기(PA)를 중심으로 RF 및 초고주파 회로 설계를 연구하고 있습니다.
      GaAs HBT 기반 고출력·고효율 전력증폭기, MMIC 및 RF 모듈 설계를 주요 연구 분야로 하며,
      다양한 RF 시스템에 적용 가능한 고효율 전력증폭기 기술 개발에 관심을 가지고 있습니다.
