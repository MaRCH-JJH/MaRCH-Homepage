    bio: RF 및 마이크로파 회로설계에 관심을 가지고 있으며, 특히 MMIC(Monolithic Microwave Integrated
      Circuit) 설계 분야를 중점적으로 공부하고 있습니다. 고주파 회로의 동작 원리와 설계 기법을 익히고, 시뮬레이션과 회로 설계
      경험을 바탕으로 RF 집적회로 설계 역량을 발전시키는 것을 목표로 하고 있습니다.
