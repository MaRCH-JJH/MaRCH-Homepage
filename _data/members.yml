  - google_scholar: "-"
    bio_en: >-
      His research focuses on RF and microwave circuit design, particularly RF
      power amplifiers (PAs).

      His research interests include high-power and high-efficiency RF power amplifiers

      using GaAs HBTs, as well as MMIC and RF module design.
    research_interests_en:
      - Load Modulation Power Amplifiers (LMPAs)
      - load-insensitive power amplifier design
      - and high-efficiency
      - high-power RF power amplifiers.
    research_interests:
      - Load Modulation Power Amplifier (LMPA)
      - Load-Insensitive Power Amplifier
      - 고효율·고출력 RF 전력증폭기 설계
    bio: |-
      RF 전력증폭기(PA)를 중심으로 RF 및 초고주파 회로 설계를 연구하고 있습니다.
      GaAs HBT 기반 고출력·고효율 전력증폭기, MMIC 및 RF 모듈 설계를 주요 연구 분야로 하며,
      다양한 RF 시스템에 적용 가능한 고효율 전력증폭기 기술 개발에 관심을 가지고 있습니다.
