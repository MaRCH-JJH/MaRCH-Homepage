  - year: 2022
    items:
      - abstract: In this paper, a two-stage single-ended power amplifier (PA) with
          broadband gain characteristics was presentedby utilizing a radio
          frequency (RF) transformer (TF), which is essential for a differential
          amplifier. The bandwidthof a PA can be improved by designing TF to
          have broadband characteristics and then applying it to the
          inter-stagematching network (IMN) of a PA. For broadband gain
          characteristics while maintaining the performance and areaof the
          existing PA, an IMN was implemented on an monolithic microwave
          integrated circuit (MMIC) and amulti-layer printed circuit board
          (PCB), and the simulation results were compared. As a result of
          simulating the PAmodule designed using InGaP/GaAs HBT model, it has
          been confirmed that the PA employing the proposed designmethod has an
          improved fractional bandwidth of 19.8% at a center frequency of
          3.3GHz, while the conventionalPA showed that of 11.2%.
        pages: 456-461
        authors: 김욱현 / Ukhyun Kim, 우제욱 / Jewook Woo, 전주영
        keywords:
          - Amplifiers
          - RF transformer
          - Broadband
          - inter-stage matching network
          - Fractional bandwidth
