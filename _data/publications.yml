  - year: 2023
    items:
      - abstract: >+
          In this paper, a Radio Frequency (RF) transformer (TF) based on LTCC
          (Low Temperature Co-fired Ceramic) forthe output stage of differential
          power amplifiers is presented. Instead of using an usual L-C matching
          circuit, asmall-sized transformer was implemented on the LTCC board
          and the results were verified through simulation. Forreduced size and
          better performance, a TF using more metal layers was implemented and
          compared with theexisting TF through simulation. As a result of
          comparison, the proposed TF has an area reduced by 55% and acoupling
          coefficient increased by 25%, and insertion loss improvement of about
          0.4dB at 5GHz was confirmed.

        pages: 53-58
        authors: 우제욱 / Jewook Woo, 김희수 / Heesu Kim, 전주영
