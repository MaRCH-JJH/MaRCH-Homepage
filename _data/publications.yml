    items:
      - abstract: In this paper, an effective miniaturization technique for a
          conventional dual-band Wilkinson power divider ispresented. By
          applying an additional size-reduction approach to a previously
          reported π-type equivalent dual-bandstructure, the effective circuit
          core area is significantly reduced while preserving the dual-band
          operatingcharacteristics. The proposed miniaturized structure is
          implemented on a cost-effective FR4 substrate instead ofexpensive
          low-loss substrates, and its validity is experimentally verified at
          0.92 GHz in the Sub-GHz IoT band and2.4 GHz in the ISM band.
        pages: 109-113
        authors: 최은성 / Eun-Seong Choi, 전주영
        keywords:
